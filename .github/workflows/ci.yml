name: MorningShield CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel redundant in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  EXPO_NO_TELEMETRY: '1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast Quality Gate: TypeScript, ESLint, Expo Config & Expo Doctor
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck & Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Expo Doctor
        run: npm run doctor

  # ---------------------------------------------------------------------------
  # 2. Bundle & Prebuild Verification (Android + iOS CNG & Metro Bundle)
  # ---------------------------------------------------------------------------
  bundle-and-prebuild:
    name: Metro Bundle & Native Prebuild
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Continuous Native Generation (Prebuild Android & iOS)
        run: npx expo prebuild --no-install --clean

      - name: Export Metro JS Bundles (Android & iOS)
        run: npx expo export --platform android --platform ios --output-dir dist
